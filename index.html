function setTh(t){theme(t);sec("chats")}
/* ---------- calls ---------- */
const bc={postMessage(m){const F=window.sanvaadFirebase;if(F&&F.cloud&&F.auth.currentUser)F.cloud.sig(m.to+"_"+now()+"_"+Math.random().toString(36).slice(2,6),{to:m.to,from:m.from,j:JSON.stringify(m),t:now()}).catch(cloudErr)}};
let pc=null,lsm=null,rsm=null,peer=null,pend=null,iceQ=[],cT0=0,cTi=null,cVid=false,cDir=0,rIv=null;
const sig=m=>{if(bc)bc.postMessage(Object.assign({from:me,to:peer},m))};
function callUI(txt,mode){let o=document.getElementById("call");if(!o){o=document.createElement("div");o.id="call";o.style.cssText="position:fixed;inset:0;z-index:120;background:linear-gradient(160deg,#1a1245,#4a2fc2 55%,#ff6b8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px";document.body.appendChild(o)}
const rb="width:56px;height:56px;background:#ffffff33;color:#fff",eb=c=>`width:64px;height:64px;background:${c};color:#fff`;
o.innerHTML=`<video id="rv" autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;${cVid?"":"display:none"}"></video><video id="lv" autoplay playsinline muted style="position:absolute;right:16px;top:16px;width:110px;border-radius:12px;z-index:2;${cVid?"":"display:none"}"></video><div style="z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px">${avu(peer,110)}<h2 style="margin:6px 0 0">${esc(dn(peer))}</h2><div id="cst">${txt}</div></div><div style="z-index:2;display:flex;gap:18px;margin-top:20px">${mode=="in"?`<button class="ic" style="${eb("#e5384f")}" title="Decline" onclick="callEnd(1)">${I.phone}</button><button class="ic" style="${eb("#1fb86a")}" title="Answer" onclick="callAcc()">${I.phone}</button>`:`<button class="ic" style="${rb}" title="Mute" onclick="cTog('a')">${I.mic}</button>${cVid?`<button class="ic" style="${rb}" title="Camera" onclick="cTog('v')">${I.vid}</button>`:""}<button class="ic" style="${eb("#e5384f")}" title="End call" onclick="callEnd(1)">${I.phone}</button>`}</div>`;
if(lsm)document.getElementById("lv").srcObject=lsm;if(rsm)document.getElementById("rv").srcObject=rsm}
function cTog(k){if(!lsm)return;(k=="a"?lsm.getAudioTracks():lsm.getVideoTracks()).forEach(t=>t.enabled=!t.enabled);toast(k=="a"?"Mute toggled":"Camera toggled")}
async function callMedia(){lsm=await navigator.mediaDevices.getUserMedia({audio:true,video:cVid})}
function mkPc(){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},{urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}]});lsm.getTracks().forEach(t=>pc.addTrack(t,lsm));pc.onicecandidate=e=>{if(e.candidate)sig({t:"ice",c:e.candidate})};
pc.ontrack=e=>{rsm=e.streams[0];const r=document.getElementById("rv");if(r)r.srcObject=rsm};
pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState=="connected"){cT0=Date.now();clearInterval(cTi);cTi=setInterval(()=>{const s=document.getElementById("cst"),d=Math.floor((Date.now()-cT0)/1000);if(s)s.textContent=Math.floor(d/60)+":"+String(d%60).padStart(2,"0")},1000)}else if(pc.connectionState=="failed"){callEnd(0);toast("Call failed")}}}
async function callStart(o,v){if(pc||pend)return toast("You are already in a call");if(!bc||!navigator.mediaDevices)return toast("Calls are not supported in this browser");peer=o;cVid=v;cDir=1;callUI("Calling…","out");try{await callMedia();callUI("Calling…","out");mkPc();const of=await pc.createOffer();await pc.setLocalDescription(of);sig({t:"offer",sdp:of,v})}catch(e){toast("Could not start the call: "+e.message);callEnd(0)}}
async function callAcc(){clearInterval(rIv);cVid=pend.v;callUI("Connecting…","out");try{await callMedia();callUI("Connecting…","out");mkPc();await pc.setRemoteDescription(pend.sdp);iceQ.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));iceQ=[];const an=await pc.createAnswer();await pc.setLocalDescription(an);sig({t:"answer",sdp:an});pend=null}catch(e){toast("Could not answer: "+e.message);callEnd(1)}}
function callEnd(notify){clearInterval(cTi);clearInterval(rIv);if(notify&&peer)sig({t:(pend&&!pc)?"decline":"end"});
if(cDir==1&&peer&&U[peer]){const dur=cT0?Math.round((Date.now()-cT0)/1000):0,d=data(),id=lid(me,peer),t=Date.now(),x=(cVid?"📹 Video call":"📞 Voice call")+(dur?" · "+Math.floor(dur/60)+":"+String(dur%60).padStart(2,"0"):" · Not answered");(d.msgs[id]=d.msgs[id]||[]).push({f:me,t,x,y:"call"});d.chats[id]={m:[me,peer],l:x,t,v:[me,peer]};save(d);sync()}
if(pc){try{pc.close()}catch(e){}}if(lsm)lsm.getTracks().forEach(t=>t.stop());pc=null;lsm=null;rsm=null;pend=null;iceQ=[];cT0=0;peer=null;cDir=0;const o=document.getElementById("call");if(o)o.remove()}
if(bc)bc.onmessage=async e=>{const m=e.data;if(!me||m.to!==me)return;
if(m.t=="offer"){if(pc||pend)return bc.postMessage({from:me,to:m.from,t:"busy"});peer=m.from;pend=m;cVid=m.v;cDir=0;callUI("Incoming "+(m.v?"video":"voice")+" call…","in");clearInterval(rIv);rIv=setInterval(beep,1400);beep()}
else if(m.t=="answer"&&pc){await pc.setRemoteDescription(m.sdp);iceQ.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));iceQ=[]}
else if(m.t=="ice"){if(pc&&pc.remoteDescription)pc.addIceCandidate(m.c).catch(()=>{});else iceQ.push(m.c)}
else if(m.t=="end"||m.t=="busy"||m.t=="decline"){if(m.from!==peer)return;const t=m.t;callEnd(0);toast(t=="busy"?"They are on another call":t=="decline"?"Call declined":"Call ended")}};
{const lk=document.createElement("link");lk.rel="icon";lk.href="data:image/svg+xml,"+encodeURIComponent(logo(64).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '));document.head.appendChild(lk)}
function out(){SS("svme",null);SS("svph",null);SS("unl",null);try{localStorage.removeItem("svlast")}catch(e){}try{window.sanvaadFirebase.logout().then(()=>location.reload(),()=>location.reload())}catch(e){location.reload()}}
</script></body></html>
